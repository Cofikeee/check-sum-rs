services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-receipts}
      POSTGRES_USER: ${POSTGRES_USER:-receiptbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receiptbot} -d ${POSTGRES_DB:-receipts}"]
      interval: 5s
      timeout: 5s
      retries: 12

  receipt-bot:
    build: .
    env_file:
      - ${RECEIPT_BOT_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # dbt source is mounted, not baked into the Telegram image.
      - ./dbt:/app/dbt
    restart: unless-stopped

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    env_file:
      - ${RECEIPT_BOT_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dbt:/app/dbt
    working_dir: /app/dbt
    profiles: ["tools"]
    command: ["build", "--project-dir", "/app/dbt", "--profiles-dir", "/app/dbt", "--target", "docker"]

volumes:
  postgres_data:
