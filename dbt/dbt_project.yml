name: receipt_warehouse
version: '1.0.0'
config-version: 2

profile: receipt_warehouse

model-paths: [models]
macro-paths: [macros]
test-paths: [tests]
target-path: target
clean-targets:
  - target
  - dbt_packages

on-run-start:
  - "create extension if not exists pgcrypto"

models:
  receipt_warehouse:
    silver:
      +schema: silver
      +materialized: incremental
      +incremental_strategy: merge
      +on_schema_change: append_new_columns
